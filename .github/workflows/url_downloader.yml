name: "دانلودر لینک مستقیم"

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct File URL(s) — separate multiple URLs with |"
        required: true
        type: string

      zip_password:
        description: "Password for archive (leave empty for no password)"
        required: false
        default: ""
        type: string

      max_part_mb:
        description: "Maximum size per part (MB)"
        required: false
        default: "90"
        type: string

      upload_method:
        description: "Upload Method"
        required: true
        default: "repository"
        type: choice
        options:
          - repository
          - release

      release_tag:
        description: "Release Tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  direct-download:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full curl

      - name: Download Files
        id: download
        shell: bash
        run: |
          mkdir -p temp_dl

          RAW_URLS="${{ github.event.inputs.file_url }}"

          # Split by pipe into an array
          IFS='|' read -ra URL_LIST <<< "$RAW_URLS"

          # Filter out blank entries to get a real count
          VALID_URLS=()
          for u in "${URL_LIST[@]}"; do
            u=$(echo "$u" | xargs)
            [[ -n "$u" ]] && VALID_URLS+=("$u")
          done
          TOTAL_FILES=${#VALID_URLS[@]}

          FILENAMES=()
          FILE_INDEX=0

          # ── helper: download one URL with a live size progress ticker ──
          download_with_progress() {
            local FILE_URL="$1"
            local DEST="$2"
            local LABEL="$3"   # e.g. "(1/3) Downloading: foo.zip"

            # Try HEAD request to learn total size (some servers don't support it)
            local TOTAL_BYTES
            TOTAL_BYTES=$(curl -sI --max-time 10 -L "$FILE_URL" \
              | grep -i '^content-length:' \
              | tail -1 \
              | awk '{print $2}' \
              | tr -d '\r')

            if [[ "$TOTAL_BYTES" =~ ^[0-9]+$ ]] && [[ "$TOTAL_BYTES" -gt 0 ]]; then
              local TOTAL_MB=$(( TOTAL_BYTES / 1024 / 1024 ))
            else
              local TOTAL_MB=""   # unknown size
            fi

            # Start download in background (suppress curl's own output)
            curl -L --fail --retry 3 --silent \
              -o "$DEST" "$FILE_URL" &
            local CURL_PID=$!

            local DOTS=""
            local LAST_MB=-1

            # Poll every 3 s while curl is running
            while kill -0 "$CURL_PID" 2>/dev/null; do
              sleep 3
              DOTS="${DOTS}."

              local CURRENT_BYTES
              CURRENT_BYTES=$(stat -c%s "$DEST" 2>/dev/null || echo 0)
              local CURRENT_MB=$(( CURRENT_BYTES / 1024 / 1024 ))

              # Only print when progress actually moved (avoids duplicate lines)
              if [[ "$CURRENT_MB" -ne "$LAST_MB" ]]; then
                if [[ -n "$TOTAL_MB" ]]; then
                  echo "${LABEL} : (${CURRENT_MB} MB / ${TOTAL_MB} MB) ${DOTS}"
                else
                  echo "${LABEL} : (${CURRENT_MB} MB downloaded) ${DOTS}"
                fi
                LAST_MB=$CURRENT_MB
              fi
            done

            # Capture curl exit code
            wait "$CURL_PID"
            local EXIT_CODE=$?

            if [[ "$EXIT_CODE" -ne 0 ]]; then
              echo "ERROR: curl failed with exit code $EXIT_CODE for $FILE_URL"
              return $EXIT_CODE
            fi

            local FINAL_BYTES
            FINAL_BYTES=$(stat -c%s "$DEST" 2>/dev/null || echo 0)
            echo "${LABEL} : Done ($(( FINAL_BYTES / 1024 / 1024 )) MB total) ✓"
          }
          # ── end helper ──

          for FILE_URL in "${VALID_URLS[@]}"; do
            FILE_INDEX=$(( FILE_INDEX + 1 ))

            FILENAME=$(basename "$FILE_URL" | cut -d'?' -f1)
            FILENAME=$(echo "$FILENAME" | sed 's/[^a-zA-Z0-9._() -]/_/g')

            LABEL="(${FILE_INDEX}/${TOTAL_FILES}) Downloading: ${FILENAME}"
            echo "──────────────────────────────────────"
            echo "URL: ${FILE_URL}"

            download_with_progress "$FILE_URL" "temp_dl/$FILENAME" "$LABEL"

            FILENAMES+=("$FILENAME")
          done

          echo "══════════════════════════════════════"
          echo "All ${TOTAL_FILES} file(s) downloaded."

          # Join filenames with comma for the output
          JOINED=$(IFS=','; echo "${FILENAMES[*]}")
          echo "filenames=$JOINED" >> "$GITHUB_OUTPUT"
          echo "count=${#FILENAMES[@]}" >> "$GITHUB_OUTPUT"

      - name: Create Split Archives
        id: archive
        shell: bash
        run: |
          PASS="${{ github.event.inputs.zip_password }}"
          THRESH_MB="${{ github.event.inputs.max_part_mb }}"

          if [[ -z "$THRESH_MB" || "$THRESH_MB" -le 0 || "$THRESH_MB" -gt 1900 ]]; then
            THRESH_MB=1800
          fi

          THRESH_BYTES=$(( THRESH_MB * 1024 * 1024 ))

          cd temp_dl || exit 1

          for BASENAME in *; do
            # Skip already-created archives to avoid re-compressing
            [[ "$BASENAME" == *.7z* ]] && continue
            [[ ! -f "$BASENAME" ]] && continue

            FILE_SIZE=$(stat -c%s "$BASENAME")

            if [[ "$FILE_SIZE" -le "$THRESH_BYTES" ]]; then
              echo "Skipping archive for: $BASENAME ($(( FILE_SIZE / 1024 / 1024 )) MB ≤ ${THRESH_MB} MB threshold — keeping original)"
              continue
            fi

            ARCHIVE_BASE="${BASENAME%.*}_$(date +%Y%m%d_%H%M%S)"

            echo "Archiving: $BASENAME ($(( FILE_SIZE / 1024 / 1024 )) MB > ${THRESH_MB} MB threshold)  →  ${ARCHIVE_BASE}.7z"

            if [ -n "$PASS" ]; then
              7z a -p"$PASS" -mhe=on -mx=3 -v${THRESH_MB}m "${ARCHIVE_BASE}.7z" "$BASENAME"
            else
              7z a -mx=3 -v${THRESH_MB}m "${ARCHIVE_BASE}.7z" "$BASENAME"
            fi

            # If only one part was created, strip the .001 suffix
            if [ -f "${ARCHIVE_BASE}.7z.001" ] && [ ! -f "${ARCHIVE_BASE}.7z.002" ]; then
              mv "${ARCHIVE_BASE}.7z.001" "${ARCHIVE_BASE}.7z"
            fi

            # Remove original only after successful archiving
            rm -f "$BASENAME"
          done

          cd ..

      - name: Get Current Date
        id: get_date
        shell: bash
        run: |
          echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Push to Repository
        if: github.event.inputs.upload_method == 'repository'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p downloads

          mv temp_dl/* downloads/ 2>/dev/null || true

          git add downloads/

          git commit -m "Direct Download: ${{ steps.download.outputs.count }} file(s) [skip ci]" || echo "Nothing to commit"

          git push

      - name: Upload to GitHub Releases
        if: github.event.inputs.upload_method == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('direct-{0}', github.run_number) }}
          name: Direct Download Release
          body: |
            Direct download completed.

            Files: ${{ steps.download.outputs.filenames }}
            Count: ${{ steps.download.outputs.count }}
            Date: ${{ steps.get_date.outputs.date }}
          files: temp_dl/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf temp_dl
